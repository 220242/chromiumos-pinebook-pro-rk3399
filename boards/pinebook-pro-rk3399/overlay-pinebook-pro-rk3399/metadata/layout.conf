cache-format = md5-dict
eapis-banned = 0 1 2 3 4 5 6
# arm64-generic supplies the unibuild config (chromeos-config-bsp), the TPM and
# GLES settings and the rest of a buildable arm64 board; this overlay only adds
# what is specific to the Pinebook Pro.
masters = portage-stable chromiumos eclass-overlay arm64-generic
profile-formats = portage-2 profile-default-eapi
profile_eapi_when_unspecified = 5-progress
repo-name = pinebook-pro-rk3399
thin-manifests = true
use-manifests = strict
