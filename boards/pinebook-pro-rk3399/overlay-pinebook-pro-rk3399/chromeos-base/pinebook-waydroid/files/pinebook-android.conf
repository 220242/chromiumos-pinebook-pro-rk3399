description     "Android apps through Waydroid (http://android.localhost)"
author          "chromiumos-pinebook-pro-rk3399"

# While someone is logged in: Android draws on Chrome's Wayland server and
# runs its session as chronos. On logout Android stops and its partition is
# unmounted.
start on start-user-session
stop on stopping ui or starting halt or starting reboot

# ChromiumOS requires an OOM score for every job. A daemon that respawn
# brings back; Android's processes start from it and then get their own
# scores from Android's low memory killer.
oom score -100

# Stopping Android (the container, then the session) takes a few seconds.
kill timeout 30
respawn
respawn limit 5 300

exec /usr/sbin/pinebook-android daemon
