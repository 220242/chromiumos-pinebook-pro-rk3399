<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  The D-Bus session bus of Android's session. ChromiumOS has no session bus,
  and `waydroid session start` registers id.waydro.Session on one.
  pinebook-android runs dbus-daemon with this file as chronos, and only
  chronos can connect (the socket's directory is chronos's, mode 0700).
-->
<busconfig>
  <type>session</type>
  <!-- pinebook-android also gives dbus-daemon this address as an option. -->
  <listen>unix:path=/run/pinebook-android/bus/socket</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
