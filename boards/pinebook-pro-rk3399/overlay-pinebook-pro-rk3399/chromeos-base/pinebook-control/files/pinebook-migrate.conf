description     "Move the system to the eMMC or an NVMe SSD when asked"
author          "chromiumos-pinebook-pro-rk3399"

# Before chromeos_startup mounts the stateful partition, so its file system
# is copied while nothing uses it. Exits at once unless boot.scr put
# pinebook.migrate=1 on the kernel command line (the Pinebook app asked).
start on starting startup
task

# ChromiumOS requires an OOM score for every job; nothing else runs yet.
oom score never

exec /usr/sbin/pinebook-migrate run
