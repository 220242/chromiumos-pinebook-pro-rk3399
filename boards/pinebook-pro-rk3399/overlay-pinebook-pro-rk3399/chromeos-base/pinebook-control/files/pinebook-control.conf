description     "Pinebook Pro control service (http://pinebook.localhost:8086)"
author          "chromiumos-pinebook-pro-rk3399"

# From early boot, so the saved CPU/GPU limits apply before anyone logs in.
start on started system-services
stop on stopping system-services

# ChromiumOS requires an OOM score for every job.
oom score -100
respawn
respawn limit 5 60

exec /usr/sbin/pinebook-control
