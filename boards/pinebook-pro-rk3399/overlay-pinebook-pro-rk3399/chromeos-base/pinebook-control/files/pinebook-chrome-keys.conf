description     "Google API keys for Chrome (see /usr/sbin/pinebook-chrome-keys)"
author          "chromiumos-pinebook-pro-rk3399"

# Before session_manager starts and reads /etc/chrome_dev.conf.
start on starting ui
task

# ChromiumOS requires an OOM score for every job.
oom score -100

exec /usr/sbin/pinebook-chrome-keys
