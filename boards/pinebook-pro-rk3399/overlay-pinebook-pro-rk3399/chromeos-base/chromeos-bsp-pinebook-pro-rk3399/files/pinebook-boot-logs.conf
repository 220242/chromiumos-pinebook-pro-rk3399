description     "Save boot logs to the EFI-SYSTEM partition (Pinebook Pro bring-up)"
author          "chromiumos-pinebook-pro-rk3399"

# As early as possible, so boots that end in a reboot loop are still logged.
start on startup
stop on starting halt or starting reboot

oom score never

exec /usr/sbin/pinebook-boot-logs
