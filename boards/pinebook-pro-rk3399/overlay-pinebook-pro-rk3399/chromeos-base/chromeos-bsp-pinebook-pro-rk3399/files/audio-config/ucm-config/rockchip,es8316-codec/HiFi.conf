# Pinebook Pro: Everest ES8316 codec on I2S1 (simple-audio-card).
# Based on alsa-ucm-conf's ucm2/Rockchip/es8316, in the UCM v1 form CRAS
# reads. Speakers and headphones share the DAC; the speaker amplifier is the
# card's "Speaker" pin switch, and CRAS picks the headphones when the jack
# input device reports a plug.

SectionVerb {
	Value {
		FullySpecifiedUCM "1"
	}
	EnableSequence [
		cdev "hw:rockchipes8316c"
		cset "name='Speaker Switch' off"
		cset "name='Headphone Playback Volume' 3"
		cset "name='Headphone Mixer Volume' 11"
		cset "name='DAC Playback Volume' 192"
		cset "name='Left Headphone Mixer Left DAC Switch' on"
		cset "name='Right Headphone Mixer Right DAC Switch' on"
		cset "name='ALC Capture Switch' off"
		cset "name='ADC Capture Volume' 192"
		cset "name='ADC PGA Gain Volume' 7"
		cset "name='Differential Mux' lin1-rin1"
		cset "name='Digital Mic Mux' 'dmic disable'"
	]
	DisableSequence [
	]
}

SectionDevice."Speaker".0 {
	Value {
		PlaybackPCM "hw:rockchipes8316c,0"
		MixerName "DAC"
	}
	EnableSequence [
		cdev "hw:rockchipes8316c"
		# The two speakers are wired in opposite phase.
		cset "name='Playback Polarity' 'R Invert'"
		cset "name='Speaker Switch' on"
	]
	DisableSequence [
		cdev "hw:rockchipes8316c"
		cset "name='Speaker Switch' off"
		cset "name='Playback Polarity' 'Normal'"
	]
}

SectionDevice."Headphone".0 {
	Value {
		PlaybackPCM "hw:rockchipes8316c,0"
		MixerName "DAC"
		JackDev "rockchip,es8316-codec Headphones"
	}
	EnableSequence [
		cdev "hw:rockchipes8316c"
		cset "name='Speaker Switch' off"
		cset "name='Playback Polarity' 'Normal'"
	]
	DisableSequence [
	]
}

SectionDevice."Internal Mic".0 {
	Value {
		CapturePCM "hw:rockchipes8316c,0"
		MixerName "ADC"
	}
	EnableSequence [
	]
	DisableSequence [
	]
}
