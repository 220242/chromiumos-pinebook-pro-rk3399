description     "Grow the stateful partition into the rest of the card"
author          "chromiumos-pinebook-pro-rk3399"

# Once the stateful partition is mounted; it grows online, in a few seconds.
# After the first boot on a card it finds nothing to do.
start on started boot-services
task

# ChromiumOS requires an OOM score for every job.
oom score -100

exec /usr/sbin/pinebook-grow-stateful
