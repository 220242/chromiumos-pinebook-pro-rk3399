description     "Load the video codec drivers before Chrome starts"
author          "chromiumos-pinebook-pro-rk3399"

# Chrome looks for /dev/video-dec* once, when its GPU process starts. The
# codec drivers (rkvdec, Hantro, RGA) are modules that udev's coldplug only
# loaded ~40 s after boot, after Chrome had already looked and found nothing
# ("Could not open /dev/video-dec0"): no hardware decoding for the whole
# session. Load them first and wait for 50-media.rules' names.
start on starting ui
task

# ChromiumOS requires an OOM score for every job.
oom score -100

script
  modprobe -a rockchip_vdec hantro_vpu rockchip_rga 2>/dev/null || true
  i=0
  while [ ${i} -lt 50 ]; do
    if [ -e /dev/video-dec0 ] && [ -e /dev/video-dec1 ]; then
      break
    fi
    sleep 0.2
    i=$((i + 1))
  done
end script
