# PineBook Pro RK3399 board configuration

BOARD_NAME="pinebook-pro-rk3399"
CHROMEOS_ARCH="arm64"
SOC="rk3399"
DEVICE_FAMILY="pinebook-pro"
BOOTLOADER="u-boot"
KERNEL="linux"
TARGET_PLATFORM="chromiumos"
USE_CUSTOM_FIRMWARE="yes"
BOARD_REVISION="unknown"
STORAGE_TARGETS="microsd,emmc,nvme"
FLASHER="dd|chromeos-firmwareupdate|cros flash"

# Boot media order (see docs/STORAGE_STRATEGY.md): microSD first for bring-up
# and recovery, then internal eMMC, then NVMe (rootfs only; U-Boot stays on
# SPI/eMMC/microSD because the RK3399 boot ROM cannot boot from PCIe).
DEFAULT_BOOT_MEDIA="microsd"
